# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
# extrakto: prefix + Tab picks text from the screen with fzf (needs fzf, python3)
set -g @plugin 'laktak/extrakto'
set -g @plugin 'dracula/tmux'
# Keep tmux-continuum last: it hooks into status-right, which themes overwrite
set -g @plugin 'tmux-plugins/tmux-continuum'

# set vi-mode
set-window-option -g mode-keys vi

# tmux-resurrect settings
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# tmux-continuum: autosave every 15 minutes, restore when the tmux server starts
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Number windows and panes from 1, keep window numbers gapless
set -g base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable mouse
set -g mouse on

# Place status bar at the bottom
set-option -g status-position bottom

# Key bindings
set -g prefix C-s
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open new panes and windows in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Sort session names
bind s choose-tree -sZ -O name

# Fuzzy-switch between sessions (excludes current), needs fzf
bind j display-popup -E "\
  tmux list-sessions -F '#{session_name}' |\
  grep -v \"^$(tmux display-message -p '#S')\$\" |\
  fzf --reverse --header 'switch session' |\
  xargs -r tmux switch-client -t"

# Fixes neovim colorscheme
set-option -sa terminal-overrides ",xterm*:Tc"

# Fixes undercurls
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Dracula theme (dracula/tmux)
# Right side shows only the clock: the default widgets (battery, network,
# weather) are noisy and weather makes network requests.
set -g @dracula-plugins "time"
set -g @dracula-time-format "%Y-%m-%d %H:%M"
set -g @dracula-show-left-icon session
set -g @dracula-show-powerline false
set -g @dracula-show-flags true

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
